# ============================================================
# config.conf — Configuración del Proyecto Final de SO
# Ajusta las variables según tu equipo y entorno.
# ============================================================

# Nombre del equipo (sin espacios)
EQUIPO="COBRA_REAL"

# Rutas relativas a la raíz del proyecto
# (los scripts se ejecutan DESDE la raíz del proyecto)
SITIO_WEB="sitio_web"
DATOS_EMPRESA="datos_empresa"
BACKUPS_DIR="backups"
LOGS_DIR="logs"
EVIDENCIA_DIR="evidencia"
REPORTES_DIR="reportes"

# Archivos de log
ACCESS_LOG="logs/access.log"
ERROR_LOG="logs/error.log"

# Configuración de respaldos
MAX_BACKUPS=3
BACKUP_PREFIX="backup_sitio"
FECHA_FORMAT="%Y%m%d_%H%M%S"

# Umbrales de análisis de seguridad
UMBRAL_IP=90        # Peticiones totales por IP para marcar como sospechosa
UMBRAL_404=40       # Errores 404 por IP para marcar como escáner
